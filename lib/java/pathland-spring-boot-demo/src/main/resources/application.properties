# Pathland SSR debug comments: when true, every rendered HTML node is prefixed
# with a comment naming its component type and the modifiers applied, e.g.
#   <!-- #1 VStack: spacing=4, alignment=Fill -->
# Debugging aid is opt-in; the live /ws deltas are unaffected.
pathland.debug-html=true

# Cache the static resources (the demo's media/icons are served from a disk
# extraction via DemoAssetsConfig, which also sends its own headers).
spring.web.resources.cache.period=7d