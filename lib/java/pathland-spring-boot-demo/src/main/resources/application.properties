# Pathland SSR debug comments: when true, every rendered HTML node is prefixed
# with a comment naming its component type and the modifiers applied, e.g.
#   <!-- #1 VStack: spacing=4, alignment=Fill -->
# Debugging aid is opt-in; the live /ws deltas are unaffected.
pathland.debug-html=true

# Cache the static resources (the demo's media/icons are served from a disk
# extraction via DemoAssetsConfig, which also sends its own headers).
spring.web.resources.cache.period=7d

# --- Observability (issue #62) -------------------------------------------------
# Metrics: Micrometer counters/timers at pathland.* are exposed at
# /actuator/prometheus; health at /actuator/health. See pathland-observability.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
# Structured (ECS JSON) console logging — the production-shaped reference app default.
logging.structured.format.console=ecs
#
# OpenTelemetry spans per frame send / event batch are OPT-IN: the OTel bridge is on
# the classpath but tracing is off by default so local dev exports nothing. To enable,
# point it at a collector and turn tracing on:
#   management.tracing.enabled=true
#   management.otlp.tracing.endpoint=http://localhost:4317
management.tracing.enabled=false
