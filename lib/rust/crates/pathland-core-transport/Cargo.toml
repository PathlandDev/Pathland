[package]
name = "pathland-core-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pathland opcode transport: shared-memory ring (existing) + network batch encode/decode with time/size batching policy"
repository = "https://github.com/michaelkrog/Pathland"
categories = ["network-programming", "encoding", "wasm", "graphics"]
keywords = ["ui", "protocol", "opcode", "transport", "batching"]

[dependencies]
pathland-core = { path = "../pathland-core" }

[dev-dependencies]
pathland-engine = { path = "../pathland-engine" }
pathland-view = { path = "../pathland-view" }
pathland-render-core = { path = "../pathland-render-core" }
