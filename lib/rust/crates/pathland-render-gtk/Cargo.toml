[package]
name = "pathland-render-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pathland GTK4 renderer: maps opcode frames onto native GTK widgets incrementally, plus a C ABI for Java hosts"
publish = false

[lib]
name = "pathland_gtk"
crate-type = ["cdylib", "rlib"]

[dependencies]
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
pathland-view-native = { path = "../pathland-view-native" }
pathland-host = { path = "../pathland-host" }
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
pango = "0.20"
libadwaita = { version = "0.7", features = ["v1_4"] }
gdk-pixbuf = "0.20"
# App-driven media playback: GStreamer directly (GTK4's own media backend is
# compiled out of some builds, e.g. Homebrew's gtk4 with `-Dmedia-gstreamer=disabled`).
gstreamer = "0.23"

[dev-dependencies]
pathland-engine = { path = "../pathland-engine" }
pathland-view = { path = "../pathland-view" }
