[package]
name = "pathland-render-html"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "Pathland HTML renderer: maps opcode frames onto declarative HTML elements"
categories = ["rendering", "web-programming"]
keywords = ["ui", "protocol", "opcode", "html", "ssr"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pathland-core = { path = "../pathland-core", version = "0.1.0" }
pathland-core-transport = { path = "../pathland-core-transport", version = "0.1.0" }
