keywords = ["ui", "protocol", "opcode", "html", "ssr", "conformance"]

[dependencies]
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
pathland-render-html = { path = "../pathland-render-html" }