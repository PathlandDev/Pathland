[workspace]
resolver = "2"
members = [
    "crates/pathland-core",
    "crates/pathland-engine",
    "crates/pathland-view",
    "crates/pathland-core-transport",
    "crates/pathland-view-native",
    "crates/pathland-core-capi",
    "crates/pathland-render-core",
    "crates/pathland-render-gtk",
    "crates/pathland-render-gtk-demo",
    "crates/pathland-render-html",
    "crates/pathland-html-golden",
    "crates/pathland-ts-codegen",
    "crates/pathland-render-qt",
    "crates/pathland-render-qt-demo",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/PathlandDev/Pathland"
homepage = "https://github.com/PathlandDev/Pathland"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
